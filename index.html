<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Once Upon Us</title>
  </head>
  <body>
    <div id="scene-container"></div>
    <main id="start-page">
      <div class="start-card">
        <div class="knit" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <h1>Once Upon Us</h1>
        <form id="gift-form" class="gift" autocomplete="off">
          <fieldset>
            <legend>Names on the cover</legend>
            <div class="names">
              <input id="name1" name="name1" aria-label="First name" maxlength="24" />
              <span aria-hidden="true">&amp;</span>
              <input id="name2" name="name2" aria-label="Second name" maxlength="24" />
            </div>
          </fieldset>
          <label for="dedication">Dedication</label>
          <textarea id="dedication" name="dedication" rows="4" maxlength="240"></textarea>
        </form>
        <button id="enter-vr" type="button" disabled>Enter VR</button>
        <p id="start-note">Preparing the book…</p>
      </div>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
